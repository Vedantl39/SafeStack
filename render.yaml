services:
  - type: web
    name: safestack
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build && npx drizzle-kit push --force
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
